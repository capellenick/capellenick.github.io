<!-- ============================================================================
     CANONICAL FOOTER  (used on index.html, about.html, playground.html)
     A full-bleed pixel-art sky: gradient, clouds (always), stars (night
     only), birds + a plane (day only), and a sun/moon that swap and travel
     across it — all driven by js/site.js part 8 from the visitor's own
     clock. Click anywhere in the sky that isn't a link to drop a frog
     (part 9). Project pages use the slim .project-foot in the copy column
     instead.

     To reposition/resize any single decoration: edit its inline
     left/top/width/height — no CSS classes to hunt down. To add one, copy
     an existing <svg> of that kind and change the numbers.
     ========================================================================= -->
