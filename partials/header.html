<!-- ============================================================================
     CANONICAL HEADER
     This file is the source of truth. When you change the nav, the logo, or
     the toggles, edit here first, then paste the <header> block into every
     *.html page (they all carry an identical copy — that's the cost of "no
     build step"). Set aria-current="page" on the link for the page you're on.

     Also keep the no-flash <script> in each page's <head> identical — it's the
     block right above </head>.
     ========================================================================= -->

<header class="site-header">

    <nav class="nav" id="primary-nav" aria-label="Primary">

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Menu">
      <span></span>
    </button>
  </div>
</header>
