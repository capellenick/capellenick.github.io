      <!-- Birds + plane fly left -> right on a loop (animation-duration/-delay
           below control speed and stagger so they don't move together).
           Birds fly at a noticeably lower altitude (top ~38-62%) than the
           plane (top ~8%), like real ones do. Each bird is two stacked
           frames (up/down wingbeat) that flip via CSS steps() — see
           .bird-frame / @keyframes flap. -->
      <div class="sky-day-deco" aria-hidden="true">
        <div class="bird" style="top:40%; width:20px; height:8.6px; animation-duration:24s; animation-delay:-4s;">

            <rect x="3" y="2" width="1" height="1"/>
